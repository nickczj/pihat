[project]
name = "spectra6-pihat"
version = "0.1.0"
description = "Implementation prep and tooling for a Spectra 6 Raspberry Pi HAT."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT OR CC-BY-SA-4.0" }
dependencies = [
  "inky==2.4.0",
  "smbus2>=0.4.3",
]

[project.optional-dependencies]
dev = []

[tool.ruff]
line-length = 100
target-version = "py311"
